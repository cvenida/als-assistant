<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <defs>
    <!-- Soft Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-bold {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 82px;
      fill: #FFFFFF;
      letter-spacing: -1px;
    }
    .brand-light {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 300;
      font-size: 82px;
      fill: #FFFFFF;
    }
    .tagline {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 26px;
      fill: #FFFFFF;
      letter-spacing: 1px;
      opacity: 0.9;
    }
    .icon-stroke {
      stroke: #FFFFFF;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-fill {
      fill: #FFFFFF;
    }
    .orbit-line {
      stroke: #FFFFFF;
      stroke-width: 1.5;
      fill: none;
      opacity: 0.35;
      stroke-dasharray: 4 4;
    }
    .node-dot {
      fill: #FFFFFF;
      filter: url(#glow);
    }
  </style>

  <!-- Background Orbit / Connectivity Rings -->
  <g transform="translate(350, 45)">
    <ellipse cx="0" cy="0" rx="280" ry="35" class="orbit-line" transform="rotate(-5)" />
    <ellipse cx="0" cy="0" rx="220" ry="25" class="orbit-line" transform="rotate(8)" />
    
    <!-- Floating Tech Nodes -->
    <circle cx="-210" cy="-10" r="4" class="node-dot" opacity="0.8" />
    <circle cx="-120" cy="-25" r="3" class="node-dot" opacity="0.6" />
    <circle cx="140" cy="-20" r="4" class="node-dot" opacity="0.8" />
    <circle cx="230" cy="8" r="3" class="node-dot" opacity="0.5" />
  </g>

  <!-- Top Line Icons (Care, Knowledge, Direction, Tech) -->
  <g transform="translate(180, 20)">
    <!-- Lightbulb / Idea -->
    <g transform="translate(20, 0) scale(0.8)">
      <path d="M9 18h6m-4 3h2M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z" class="icon-stroke" />
    </g>

    <!-- Chat / Heart -->
    <g transform="translate(120, 0) scale(0.8)">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" class="icon-stroke" />
      <path d="M12 13s-3-2-3-3.5A1.5 1.5 0 0 1 10.5 8c.8 0 1.5.5 1.5.5s.7-.5 1.5-.5A1.5 1.5 0 0 1 15 9.5C15 11 12 13 12 13z" class="icon-fill" />
    </g>

    <!-- Book / Growth -->
    <g transform="translate(220, 0) scale(0.8)">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" class="icon-stroke" />
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" class="icon-stroke" />
      <path d="M9 10l2-2 2 2m-2-2v6" class="icon-stroke" />
    </g>

    <!-- Compass / Navigation -->
    <g transform="translate(310, 0) scale(0.8)">
      <circle cx="12" cy="12" r="10" class="icon-stroke" />
      <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" class="icon-stroke" />
    </g>
  </g>

  <!-- Main Text: ALS Assistant -->
  <text x="350" y="145" text-anchor="middle">
    <tspan class="brand-bold">ALS</tspan>
    <tspan class="brand-light"> Assistant</tspan>
  </text>

  <!-- Tagline Text -->
  <text x="350" y="195" text-anchor="middle" class="tagline">
    Empowering Lives with Smart Care
  </text>
</svg>
